# Test ponctuel : la veille TikTok peut-elle lister et télécharger depuis les serveurs GitHub ?
name: veille-test
on:
  push:
    paths: [".github/workflows/veille-test.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install -U "yt-dlp[default]" && sudo apt-get install -y ffmpeg >/dev/null && yt-dlp --version
      - name: Lister les dernières vidéos
        run: yt-dlp --flat-playlist --playlist-end 5 --print "%(id)s | %(timestamp)s | %(title).80s" "https://www.tiktok.com/@prisma_fx" || echo "LISTE_ECHEC"
      - name: Télécharger l'audio de la plus récente
        run: |
          yt-dlp --playlist-end 1 -x --audio-format mp3 --audio-quality 5 -o "audio.%(ext)s" "https://www.tiktok.com/@prisma_fx" || echo "AUDIO_ECHEC"
          ls -la audio.* 2>/dev/null || true
      - name: Téléchargement par lien direct
        run: |
          yt-dlp -x --audio-format mp3 --audio-quality 5 -o "lien.%(ext)s" "https://vm.tiktok.com/ZN8fjy2Y4/" || echo "LIEN_ECHEC"
          ls -la lien.* 2>/dev/null || true
