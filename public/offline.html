<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hors ligne · Bastien's Space</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --green: #28c157; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #f5f5f7; --muted: #a1a1a6; --green: #30d158; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); padding: 24px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", system-ui, sans-serif; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 0 40px color-mix(in oklab, var(--green) 35%, transparent); }
  h1 { font-size: 28px; letter-spacing: -0.03em; }
  p { color: var(--muted); margin-top: 6px; }
  button { margin-top: 24px; border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 500; background: var(--text); color: var(--bg); }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>Pas de connexion</h1>
    <p>Tes données s'afficheront dès que le réseau sera revenu.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
